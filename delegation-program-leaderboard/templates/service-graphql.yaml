{{- if .Values.leaderboardGraphql.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "delegation-program-leaderboard.fullname" . }}-graphql
  labels:
    {{- include "delegation-program-leaderboard.labels" . | nindent 4 }}-graphql
spec:
  type: {{ .Values.leaderboardGraphql.service.type }}
  ports:
    - port: {{ .Values.leaderboardGraphql.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "delegation-program-leaderboard.selectorLabels" . | nindent 4 }}-graphql
{{- end }}

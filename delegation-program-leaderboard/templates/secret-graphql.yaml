{{- if .Values.leaderboardGraphql.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "delegation-program-leaderboard.fullname" . }}-graphql-db
  labels:
    {{- include "delegation-program-leaderboard.labels" . | nindent 4 }}-graphql
type: Opaque
stringData:
  user: {{ required "leaderboardGraphql.db.user is required (use the read-only role)" .Values.leaderboardGraphql.db.user | quote }}
  password: {{ required "leaderboardGraphql.db.password is required" .Values.leaderboardGraphql.db.password | quote }}
{{- end }}

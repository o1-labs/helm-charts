apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-worker
data:
  entrypoint-worker.sh: |-
{{ .Files.Get "files/entrypoint_worker.sh" | indent 4 }}
  {{- /*
    The coordinator assembles each worker Job's env from a fixed list in
    server.py, so setting a variable on the coordinator does not make it reach
    the worker. Anything the delegation-verify worker itself reads - e.g.
    TOLERATE_SOK_MISMATCH - has to arrive through the entrypoint, which is what
    this file is for. Empty by default, so a deployment that sets nothing renders
    an empty script and behaves exactly as before.
  */}}
  worker-env.sh: |-
    #!/usr/bin/env bash
    # Rendered from coordinator.worker.extraEnv - do not edit in the cluster.
{{- range $name, $value := .Values.coordinator.worker.extraEnv }}
    export {{ $name }}={{ $value | quote }}
{{- end }}
  {{- /*
    Same reasoning for files: this ConfigMap is the only volume the coordinator
    mounts into a worker Job (at /bin/entrypoint), so a file the worker needs at
    runtime - e.g. a post-hard-fork genesis ledger that did not exist when the
    image was built - can only reach it from here. Point the worker at it with
    extraEnv, e.g. GENESIS_LEDGER_FILE_POST_FORK=/bin/entrypoint/<name>.
    Keep these small: a ConfigMap is capped at 1 MiB in total.
  */}}
{{- range $name, $content := .Values.coordinator.worker.extraFiles }}
  {{ $name }}: |-
{{ $content | indent 4 }}
{{- end }}
